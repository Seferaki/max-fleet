server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8k;
    large_client_header_buffers 4 16k;

    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://st.max.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; frame-ancestors https://max.ru https://*.max.ru" always;

    location = /health/live {
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /health/ready {
        add_header Content-Type application/json;
        return 200 '{"status":"static_ready"}';
    }

    location = /max/webhook {
        access_log off;
        client_max_body_size 256k;
        client_body_buffer_size 256k;
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
        proxy_connect_timeout 3s;
        proxy_send_timeout 25s;
        proxy_read_timeout 25s;
    }

    location ^~ /api/v1/ {
        access_log off;
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
