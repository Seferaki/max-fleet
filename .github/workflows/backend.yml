name: backend

on:
  push:
    branches: [codex/backend]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить правила путей secret scan
        run: python3 scripts/test_check_secrets.py
      - name: Проверить режимы локальных secret-файлов без чтения значений
        shell: bash
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          trap 'rm -rf -- "$test_root"' EXIT
          XDG_DATA_HOME="$test_root/xdg" scripts/bootstrap.sh >/dev/null
          secret_dir="$test_root/xdg/max-fleet/secrets"
          test "$(stat -c '%a' "$secret_dir")" = 700
          test "$(stat -c '%a' "$secret_dir/data_api_token")" = 444
          test "$(stat -c '%a' "$secret_dir/worker_api_token")" = 444
          test "$(stat -c '%a' "$secret_dir/postgres_password")" = 600
          echo "Bootstrap file permissions passed"
      - name: Проверить tracked-файлы без вывода содержимого
        run: python3 scripts/check-secrets.py --tracked

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - run: python -m pip install -r contracts/requirements-dev.txt
      - run: python contracts/validate.py
      - run: npx --yes @redocly/cli@2.54.3 lint contracts/data-api.openapi.yaml contracts/map-api.openapi.yaml --config redocly.yaml --format=stylish

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/gateway/go.mod
          cache-dependency-path: services/gateway/go.sum
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/gateway ./cmd/data-mock

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Проверить Compose manifest без Engine
        run: docker compose -f deploy/compose.backend.yaml config --no-interpolate --quiet
      - name: Холодный запуск и восстановление после перезапуска
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          compose=(docker compose -p max-fleet-ci-backend -f deploy/compose.backend.yaml)
          cleanup() {
            "${compose[@]}" down >/dev/null 2>&1 || true
            rm -rf -- "$secret_dir"
          }
          trap cleanup EXIT
          openssl rand -hex 32 > "$secret_dir/data_api_token"
          openssl rand -hex 32 > "$secret_dir/worker_api_token"
          # File-backed Compose secrets are bind mounts; service containers run as UID 10001.
          # The parent stays private to the runner, while mounted tokens must be readable by that UID.
          chmod 700 "$secret_dir"
          chmod 444 "$secret_dir"/*
          export MAX_FLEET_DATA_API_TOKEN_FILE="$secret_dir/data_api_token"
          export MAX_FLEET_WORKER_API_TOKEN_FILE="$secret_dir/worker_api_token"
          if ! "${compose[@]}" up --build -d --wait --wait-timeout 180; then
            echo "Compose startup failed; sanitized data-mock startup logs follow:" >&2
            "${compose[@]}" logs --no-color --tail=80 data-mock >&2 || true
            exit 1
          fi
          for service in data-mock gateway web; do
            container_id="$("${compose[@]}" ps -q "$service")"
            runtime_security="$(docker inspect --format '{{.Config.User}}|{{.HostConfig.ReadonlyRootfs}}' "$container_id")"
            IFS='|' read -r runtime_user read_only <<< "$runtime_security"
            if [[ -z "$runtime_user" || "$runtime_user" == "0" || "$runtime_user" == "root" || "$read_only" != "true" ]]; then
              echo "Unsafe container settings for $service" >&2
              exit 1
            fi
          done
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/health/live
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8081/health/ready
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8081/
          "${compose[@]}" restart gateway
          "${compose[@]}" up -d --wait --wait-timeout 90
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/health/live
