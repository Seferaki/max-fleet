      - dead
    InboxStoredResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/InboxStored'
        request_id:
          $ref: '#/components/schemas/UUID'
      required:
      - data
      - request_id
    InboxClaimResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/InboxClaim'
        request_id:
          $ref: '#/components/schemas/UUID'
      required:
      - data
