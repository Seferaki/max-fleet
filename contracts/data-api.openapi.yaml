    post:
      tags:
      - commands
      operationId: executeCommand
      summary: Выполнить бизнес-команду
      description: Idempotency-Key scoped by actor, reused after timeout. Same key/different operation, target,
        version or payload → IDEMPOTENCY_CONFLICT. Domain, audit, outbox and result commit atomically. X-Inbox-*
        pair required for inbox-driven commands; lease fencing checked by Python. Map request uses trusted Go path
        after initData validation.
      security:
      - DataBearer: []
      parameters:
      - $ref: '#/components/parameters/ContractVersion'
      - $ref: '#/components/parameters/RequestID'
      - $ref: '#/components/parameters/ActorMaxID'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: X-Inbox-Event-ID
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/UUID'
      - name: X-Inbox-Lease
        in: header
        required: false
        schema:
          type: string
          maxLength: 200
        description: Opaque fencing token; never log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
      responses:
        '200':
          description: Подтверждённое состояние
