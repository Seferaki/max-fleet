    QueueTransitionResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/QueueTransition'
        request_id:
          $ref: '#/components/schemas/UUID'
      required:
      - data
      - request_id
    IntegrationResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Integration'
        request_id:
          $ref: '#/components/schemas/UUID'
