          - type: string
            maxLength: 1000
          - type: 'null'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - type
      - resource_id
      - vehicle_id
      - reason
      - occurred_at
    NotificationLease:
      type: object
      additionalProperties: false
      properties:
        delivery_id:
          $ref: '#/components/schemas/UUID'
        event:
          $ref: '#/components/schemas/NotificationEvent'
        recipient_max_user_id:
          $ref: '#/components/schemas/MaxID'
        lease_token:
          type: string
          maxLength: 200
        lease_expires_at:
          $ref: '#/components/schemas/Timestamp'
        attempt:
          type: integer
          minimum: 1
      required:
      - delivery_id
      - event
      - recipient_max_user_id
      - lease_token
      - lease_expires_at
      - attempt
    NotificationClaim:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationLease'
          maxItems: 50
      required:
      - items
    NotificationAck:
      type: object
      additionalProperties: false
      properties:
        lease_token:
          type: string
          maxLength: 200
        provider_message_id:
          type: string
          maxLength: 200
      required:
      - lease_token
      - provider_message_id
    NotificationRetry:
      type: object
      additionalProperties: false
      properties:
        lease_token:
