          const: trip.admin_close
        target_id:
          $ref: '#/components/schemas/UUID'
        expected_version:
          $ref: '#/components/schemas/Version'
        payload:
          type: object
          additionalProperties: false
          properties:
            reason:
              type: string
              maxLength: 1000
            challenge_id:
              $ref: '#/components/schemas/UUID'
            available_data:
              $ref: '#/components/schemas/AdminCloseData'
          required:
          - reason
          - challenge_id
      required:
      - operation
      - target_id
      - expected_version
      - payload
    ConversationSaveCommand:
      type: object
      additionalProperties: false
      properties:
        operation:
          const: conversation.save
        target_id:
          $ref: '#/components/schemas/UUID'
        expected_version:
          $ref: '#/components/schemas/Version'
        payload:
          type: object
          additionalProperties: false
          properties:
            flow:
              $ref: '#/components/schemas/ConversationFlow'
            step:
              type: string
              maxLength: 80
            context: *id001
            pending_input_kind:
              oneOf:
              - type: string
                enum:
                - text
                - photo
                - geo
                - none
              - type: 'null'
          required:
          - flow
          - step
          - context
      required:
      - operation
      - target_id
      - expected_version
      - payload
    Command:
      oneOf:
      - $ref: '#/components/schemas/CheckoutCreateCommand'
      - $ref: '#/components/schemas/CheckoutCancelCommand'
      - $ref: '#/components/schemas/ChallengeCreateCommand'
      - $ref: '#/components/schemas/ChallengeAnswerCommand'
      - $ref: '#/components/schemas/CheckoutAcceptRulesCommand'
      - $ref: '#/components/schemas/InspectionUpdateCommand'
      - $ref: '#/components/schemas/InspectionConfirmPhotosCommand'
      - $ref: '#/components/schemas/CheckoutSetNoNewIssuesCommand'
      - $ref: '#/components/schemas/CheckoutStartCommand'
      - $ref: '#/components/schemas/TripBeginReturnCommand'
      - $ref: '#/components/schemas/ReturnCancelCommand'
      - $ref: '#/components/schemas/ReturnSetLocationCommand'
      - $ref: '#/components/schemas/ReturnCompleteCommand'
      - $ref: '#/components/schemas/IssueCreateCommand'
      - $ref: '#/components/schemas/VehicleBlockCommand'
      - $ref: '#/components/schemas/VehicleUnblockCommand'
      - $ref: '#/components/schemas/VehicleEditCommand'
      - $ref: '#/components/schemas/VehicleCorrectSnapshotCommand'
      - $ref: '#/components/schemas/VehicleAnnotateCommand'
      - $ref: '#/components/schemas/EmployeeGrantCommand'
      - $ref: '#/components/schemas/EmployeeAccessCommand'
      - $ref: '#/components/schemas/IssueResolveCommand'
      - $ref: '#/components/schemas/TripAdminCloseCommand'
      - $ref: '#/components/schemas/ConversationSaveCommand'
      discriminator:
        propertyName: operation
        mapping:
          checkout.create: '#/components/schemas/CheckoutCreateCommand'
          checkout.cancel: '#/components/schemas/CheckoutCancelCommand'
          challenge.create: '#/components/schemas/ChallengeCreateCommand'
          challenge.answer: '#/components/schemas/ChallengeAnswerCommand'
          checkout.accept_rules: '#/components/schemas/CheckoutAcceptRulesCommand'
          inspection.update: '#/components/schemas/InspectionUpdateCommand'
          inspection.confirm_photos: '#/components/schemas/InspectionConfirmPhotosCommand'
          checkout.set_no_new_issues: '#/components/schemas/CheckoutSetNoNewIssuesCommand'
          checkout.start: '#/components/schemas/CheckoutStartCommand'
          trip.begin_return: '#/components/schemas/TripBeginReturnCommand'
          return.cancel: '#/components/schemas/ReturnCancelCommand'
          return.set_location: '#/components/schemas/ReturnSetLocationCommand'
          return.complete: '#/components/schemas/ReturnCompleteCommand'
          issue.create: '#/components/schemas/IssueCreateCommand'
          vehicle.block: '#/components/schemas/VehicleBlockCommand'
          vehicle.unblock: '#/components/schemas/VehicleUnblockCommand'
          vehicle.edit: '#/components/schemas/VehicleEditCommand'
          vehicle.correct_snapshot: '#/components/schemas/VehicleCorrectSnapshotCommand'
          vehicle.annotate: '#/components/schemas/VehicleAnnotateCommand'
          employee.grant: '#/components/schemas/EmployeeGrantCommand'
          employee.access: '#/components/schemas/EmployeeAccessCommand'
          issue.resolve: '#/components/schemas/IssueResolveCommand'
          trip.admin_close: '#/components/schemas/TripAdminCloseCommand'
          conversation.save: '#/components/schemas/ConversationSaveCommand'
      description: Каждая операция имеет собственный payload. expected_version относится к target_id; чужой/устаревший
        объект не изменяется.
    CommandResult:
      type: object
      additionalProperties: false
      properties:
        operation:
          type: string
          enum:
          - checkout.create
          - checkout.cancel
          - challenge.create
          - challenge.answer
          - checkout.accept_rules
          - inspection.update
          - inspection.confirm_photos
          - checkout.set_no_new_issues
          - checkout.start
          - trip.begin_return
          - return.cancel
          - return.set_location
          - return.complete
          - issue.create
          - vehicle.block
          - vehicle.unblock
          - vehicle.edit
          - vehicle.correct_snapshot
          - vehicle.annotate
          - employee.grant
          - employee.access
          - issue.resolve
          - trip.admin_close
          - conversation.save
        aggregate:
          oneOf:
          - $ref: '#/components/schemas/Checkout'
          - $ref: '#/components/schemas/Return'
          - $ref: '#/components/schemas/Trip'
          - $ref: '#/components/schemas/Inspection'
          - $ref: '#/components/schemas/Issue'
          - $ref: '#/components/schemas/Vehicle'
          - $ref: '#/components/schemas/Employee'
          - $ref: '#/components/schemas/Challenge'
          - $ref: '#/components/schemas/Conversation'
          description: Полное подтверждённое состояние объекта, соответствующего операции.
        correct:
          oneOf:
          - type: boolean
          - type: 'null'
        attempts_remaining:
          oneOf:
          - type: integer
            minimum: 0
            maximum: 3
          - type: 'null'
        challenge_proof_id:
          oneOf:
          - $ref: '#/components/schemas/UUID'
          - type: 'null'
          description: UUID успешно решённого admin challenge; тот же ID команда передаёт как challenge_id. Mock/Python
            сверяют SHA-256 полного canonical intent и потребляют proof один раз.
      required:
      - operation
      - aggregate
      - correct
      - attempts_remaining
      - challenge_proof_id
    CommandResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/CommandResult'
        request_id:
          $ref: '#/components/schemas/UUID'
      required:
      - data
      - request_id
    InspectionPhotoUpload:
      type: object
      additionalProperties: false
      properties:
        image:
          type: string
          format: binary
        expected_version:
          $ref: '#/components/schemas/Version'
        source_event_key:
          type: string
          maxLength: 200
      required:
      - image
      - expected_version
      - source_event_key
      description: Single JPEG/PNG/WebP, максимум 10 MiB и 25 MP. MIME, сигнатура, декодирование и SHA-256 проверяются
        Python. Один slot 1…8; duplicate SHA в том же осмотре отклоняется; замена не стирает остальные 7.
    StagePhotoUpload:
      type: object
      additionalProperties: false
      properties:
        image:
          type: string
          format: binary
        purpose:
          const: issue
        scope_type:
          type: string
          enum:
          - vehicle
          - trip
          - inspection
        scope_id:
          $ref: '#/components/schemas/UUID'
        source_event_key:
          type: string
          maxLength: 200
      required:
      - image
      - purpose
      - scope_type
      - scope_id
      - source_event_key
    NormalizedEvent:
      type: object
      additionalProperties: false
      properties:
        integration_key:
          type: string
          maxLength: 100
        event_key:
          type: string
          maxLength: 200
        event_type:
          type: string
          enum:
          - bot_started
          - message_created
          - message_callback
        actor_max_user_id:
          $ref: '#/components/schemas/MaxID'
        chat_id:
          $ref: '#/components/schemas/MaxID'
        message_id:
          oneOf:
          - type: string
            maxLength: 200
          - type: 'null'
        callback_id:
          oneOf:
          - type: string
            maxLength: 200
          - type: 'null'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        payload:
          type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
              - start
              - text
              - photo
              - geo
              - callback
            text:
              oneOf:
              - type: string
                maxLength: 1000
              - type: 'null'
            callback_data:
              oneOf:
              - type: string
                maxLength: 200
              - type: 'null'
            photo_source_key:
              oneOf:
              - type: string
                maxLength: 500
              - type: 'null'
            latitude:
              oneOf:
              - type: number
                minimum: -90
                maximum: 90
              - type: 'null'
            longitude:
              oneOf:
              - type: number
                minimum: -180
                maximum: 180
              - type: 'null'
            attachment_count:
              type: integer
              minimum: 0
              maximum: 100
          required:
          - kind
          - text
          - callback_data
          - photo_source_key
          - latitude
          - longitude
          - attachment_count
      required:
      - integration_key
      - event_key
      - event_type
      - actor_max_user_id
      - chat_id
      - message_id
      - callback_id
      - occurred_at
      - payload
      description: Go нормализует только личный чат и поддержанные события. event_key = message:<id>:<type> либо
        callback:<id>:<type>; для остальных — SHA-256 канонических нормализованных полей. Уникальность по integration_key+event_key.
        Содержимое фото в очередь не кладётся.
    InboxStored:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        duplicate:
          type: boolean
        stored_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - duplicate
      - stored_at
    InboxClaimRequest:
      type: object
      additionalProperties: false
      properties:
        worker_id:
          type: string
          maxLength: 100
        max_items:
          type: integer
          minimum: 1
          maximum: 50
      required:
      - worker_id
      - max_items
    InboxLease:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        event:
          $ref: '#/components/schemas/NormalizedEvent'
        lease_token:
          type: string
          maxLength: 200
        lease_expires_at:
          $ref: '#/components/schemas/Timestamp'
        attempt:
          type: integer
          minimum: 1
      required:
      - id
      - event
      - lease_token
      - lease_expires_at
      - attempt
      description: Один actor обрабатывается последовательно. Истёкший lease/token не даёт выполнить бизнес-команду.
    InboxClaim:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InboxLease'
          maxItems: 50
      required:
      - items
    LeaseAck:
      type: object
      additionalProperties: false
      properties:
        lease_token:
          type: string
          maxLength: 200
      required:
      - lease_token
    InboxRetry:
      type: object
      additionalProperties: false
      properties:
        lease_token:
          type: string
          maxLength: 200
        error_code:
          type: string
          maxLength: 80
        next_attempt_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - lease_token
      - error_code
      - next_attempt_at
    QueueTransition:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        state:
          type: string
          enum:
          - done
          - retry
          - dead
          - sent
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - state
      - updated_at
    Integration:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          maxLength: 100
        mode:
          type: string
          enum:
          - webhook
          - polling
        marker:
          oneOf:
          - type: string
            maxLength: 500
          - type: 'null'
        lease_expires_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        version:
          $ref: '#/components/schemas/Version'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - key
      - mode
      - marker
      - lease_expires_at
      - version
      - updated_at
    IntegrationLeaseRequest:
      type: object
      additionalProperties: false
      properties:
        worker_id:
          type: string
          maxLength: 100
        expected_version:
          $ref: '#/components/schemas/Version'
      required:
      - worker_id
      - expected_version
    IntegrationLease:
      type: object
      additionalProperties: false
      properties:
        lease_token:
          type: string
          maxLength: 200
        lease_expires_at:
          $ref: '#/components/schemas/Timestamp'
        integration:
          $ref: '#/components/schemas/Integration'
      required:
      - lease_token
      - lease_expires_at
      - integration
    IntegrationCheckpoint:
      type: object
      additionalProperties: false
      properties:
        lease_token:
          type: string
          maxLength: 200
        expected_version:
          $ref: '#/components/schemas/Version'
        previous_marker:
          oneOf:
          - type: string
            maxLength: 500
          - type: 'null'
        new_marker:
          type: string
          maxLength: 500
        stored_event_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          maxItems: 50
      required:
      - lease_token
      - expected_version
      - previous_marker
      - new_marker
      - stored_event_ids
      description: Marker продвигается CAS только после durable записи всей пачки событий.
    NotificationClaimRequest:
      type: object
      additionalProperties: false
      properties:
        worker_id:
          type: string
          maxLength: 100
        max_items:
          type: integer
          minimum: 1
          maximum: 50
      required:
      - worker_id
      - max_items
    NotificationEvent:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - trip_started
          - trip_completed
          - trip_admin_closed
          - issue_created
          - issue_resolved
          - vehicle_blocked
          - access_changed
        resource_id:
          $ref: '#/components/schemas/UUID'
        vehicle_id:
          oneOf:
          - $ref: '#/components/schemas/UUID'
