paths:
  /internal/v1/meta:
    get:
      tags:
      - read
      operationId: getMeta
      summary: getMeta
      description: ''
      security:
      - DataBearer: []
      parameters:
      - $ref: '#/components/parameters/ContractVersion'
      - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Подтверждённое состояние
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
        '400':
          description: INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: INVALID_SERVICE_TOKEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ACCESS_DENIED for reads, ADMIN_REQUIRED for admin commands, or CANNOT_START_TRIP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: STALE_VERSION or INVALID_STATE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: FILE_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: UNSUPPORTED_MEDIA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: PHOTO_SET_INCOMPLETE, CHALLENGE_EXPIRED, RULES_REQUIRED, or other business validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: TEMPORARY_FAILURE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
